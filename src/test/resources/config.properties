# Application
base.url=https://eventhub.rahulshettyacademy.com
login.path=/login
register.path=/register
events.path=/events
bookings.path=/bookings

# Browser
# chromium | firefox | webkit
browser=chromium
# optional: chrome | msedge (only for chromium)
browser.channel=
headless=true
slow.mo=0
viewport.width=1440
viewport.height=900

# Timeouts (ms)
timeout.default=15000
timeout.navigation=30000

# Diagnostics
# on-failure | off
video=false
tracing=on-failure

# Execution
retry.count=1

# Test User
# Leave blank to auto-register a fresh user through the UI once per run.
# Or pass: -Dtest.email=me@x.com -Dtest.password=Secret1 (or env TEST_EMAIL / TEST_PASSWORD)
test.email=
test.password=